<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atividade 7 - Header Responsivo do IFRN</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <header class="bg-green-600 bg-cover bg-center border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 md:px-6 py-3 flex flex-col gap-3">

            <!-- LINHA 1: logo/slogan + ações -->
            <div class="flex items-center justify-between gap-4 flex-nowrap">

                <!-- LOGO + SLOGAN -->
                <div class="flex flex-col shrink-0">
                    <h1 class="m-0">
                        <a href="#"
                            title="Instituto Federal de Educação, Ciência e Tecnologia do Estado do Rio Grande do Norte"
                            class="text-2xl md:text-3xl font-bold text-white no-underline hover:text-green-100 transition">
                            <img src="assets/img/ifrn_logo_branco.svg" alt="IFRN" class="h-10 md:h-12" />
                        </a>
                    </h1>
                    <p class="slogan hidden md:block text-sm text-white/80 mt-1">
                        Educação, Ciência, Cultura e Tecnologia em todo o Rio Grande do Norte
                    </p>
                </div>

                <!-- MENU HAMBÚRGUER (mobile) -->
                <button id="menuToggle" aria-label="Menu"
                    class="md:hidden bg-transparent border-none p-2 rounded cursor-pointer text-white text-2xl hover:bg-white/10 transition">
                    <i class="ph ph-list"></i>
                </button>

                <!-- AÇÕES (ícones sociais, busca, contraste, modo escuro) -->
                <div class="hidden md:flex items-center gap-3 shrink-0">

                    <!-- Ícones sociais -->
                    <div class="social hidden lg:flex items-center gap-2 text-white/80">
                        <a href="#" aria-label="Instagram" class="hover:text-white transition"><i class="ph ph-instagram-logo text-lg"></i></a>
                        <a href="#" aria-label="Twitter" class="hover:text-white transition"><i class="ph ph-twitter-logo text-lg"></i></a>
                        <a href="#" aria-label="LinkedIn" class="hover:text-white transition"><i class="ph ph-linkedin-logo text-lg"></i></a>
                        <a href="#" aria-label="YouTube" class="hover:text-white transition"><i class="ph ph-youtube-logo text-lg"></i></a>
                        <a href="#" aria-label="Spotify" class="hover:text-white transition"><i class="ph ph-spotify-logo text-lg"></i></a>
                        <a href="#" aria-label="TikTok" class="hover:text-white transition"><i class="ph ph-tiktok-logo text-lg"></i></a>
                    </div>

                    <!-- Busca -->
                    <form method="get" action="/search/" id="busca"
                        class="flex items-center bg-white/90 rounded-full px-3 py-1 border border-transparent focus-within:ring-2 focus-within:ring-white">
                        <input type="search" name="query" placeholder="Busca" aria-label="Busca"
                            class="bg-transparent outline-none text-sm text-gray-700 w-20 sm:w-32 focus:outline-none" />
                        <button type="submit" aria-label="Pesquisar"
                            class="bg-transparent border-none p-1 cursor-pointer text-gray-600 hover:text-green-700 transition">
                            <i class="ph ph-magnifying-glass"></i>
                        </button>
                    </form>

                    <!-- Alto contraste -->
                    <button id="altocontraste" type="button" aria-label="Alto contraste"
                        class="bg-transparent border-none p-2 rounded cursor-pointer text-white/80 hover:bg-white/10 hover:text-white transition">
                        <i class="ph ph-contrast"></i>
                    </button>

                    <!-- Modo escuro -->
                    <button type="button" aria-label="Modo escuro"
                        class="bg-transparent border-none p-2 rounded cursor-pointer text-white/80 hover:bg-white/10 hover:text-white transition">
                        <i class="ph ph-moon"></i>
                    </button>
                </div>
            </div>

            <hr class="border-white">

            <!-- LINHA 2: navegação principal -->
            <nav aria-label="Navegação principal"
                class="hidden md:flex flex-wrap items-center gap-4 lg:gap-6 w-full">
                <a href="#" class="text-white no-underline hover:text-green-100 transition text-sm">Processos seletivos</a>
                <a href="#" class="text-white no-underline hover:text-green-100 transition text-sm">Cursos</a>
                <a href="#" class="text-white no-underline hover:text-green-100 transition text-sm">Campi</a>
                <a href="#" class="text-white no-underline hover:text-green-100 transition text-sm">Institucional</a>
                <a href="#" class="text-white no-underline hover:text-green-100 transition text-sm">Acesso à Informação</a>
                <a href="#" class="text-white no-underline hover:text-green-100 transition text-sm">Eventos</a>
                <a href="#" class="text-white no-underline hover:text-green-100 transition text-sm">Serviços</a>
            </nav>
        </div>
    </header>

</body>

</html>
