          Exibindo: <strong>{{ oficinasVisiveis.length }}</strong>

      </div>

        Nenhuma oficina encontrada.
      </p>

            <p class="font-semibold break-words">{{ oficina.titulo }}</p>
            <span v-if="oficina.favorita" class="badge badge-warning badge-sm mt-1">Favorita</span>
          </div>
          <div class="flex gap-2">
            <button type="button" class="btn btn-sm flex-1 sm:flex-none"
              :class="oficina.favorita ? 'btn-warning' : 'btn-outline'"
              :aria-label="(oficina.favorita ? 'Desfavoritar ' : 'Favoritar ') + oficina.titulo"
              @click="alternarFavorito(oficina.id)">
              {{ oficina.favorita ? '★ Favorita' : '☆ Favoritar' }}
